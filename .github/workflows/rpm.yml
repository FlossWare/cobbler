# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CD-CI for RPM

on:
    push:
        branches: [ main ]

jobs:
    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.pusher.email != 'noreply@flossware.org'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install build tools
              run: sudo apt-get update && sudo apt-get install -y rpm debhelper dpkg-dev

            - name: Extract version information
              run: |
                  VERSION=$(rpm -q --queryformat '%{VERSION}\n' --specfile flossware.spec | head -1)
                  OLD_RELEASE=$(rpm -q --queryformat '%{RELEASE}\n' --specfile flossware.spec | head -1)
                  NEW_RELEASE=$((OLD_RELEASE + 1))

                  echo "VERSION=${VERSION}" >> $GITHUB_ENV
                  echo "OLD_RELEASE=${OLD_RELEASE}" >> $GITHUB_ENV
                  echo "NEW_RELEASE=${NEW_RELEASE}" >> $GITHUB_ENV

                  echo "Building version ${VERSION}-${NEW_RELEASE}"

            - name: Update spec file release
              run: |
                  sed -i "s/^Release:.*$/Release:  ${NEW_RELEASE}/g" flossware.spec

            - name: Update debian changelog version
              run: |
                  sed -i "1s/(.*)/($VERSION-$NEW_RELEASE)/" debian/changelog

            - name: Display updated spec
              run: cat flossware.spec

            - name: Build RPM
              run: ./buildrpm.sh

            - name: Build DEB
              run: ./builddeb.sh

            - name: Verify packages were created
              run: |
                  RPM_FILE="/tmp/flossware/cobbler/RPMS/noarch/flossware-cobbler-${VERSION}-${NEW_RELEASE}.noarch.rpm"
                  DEB_FILE="/tmp/flossware/cobbler/deb/flossware-cobbler_1.0-${NEW_RELEASE}_all.deb"

                  if [ ! -f "${RPM_FILE}" ]; then
                    echo "ERROR: RPM not found: ${RPM_FILE}"
                    exit 1
                  fi
                  echo "Successfully built RPM: ${RPM_FILE}"
                  rpm -qip "${RPM_FILE}"

                  if [ ! -f "${DEB_FILE}" ]; then
                    echo "ERROR: DEB not found: ${DEB_FILE}"
                    exit 1
                  fi
                  echo "Successfully built DEB: ${DEB_FILE}"
                  dpkg -I "${DEB_FILE}"

            - name: Install packagecloud CLI
              run: gem install package_cloud

            - name: Deploy to packagecloud.io
              env:
                PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
              run: |
                  RPM_FILE="/tmp/flossware/cobbler/RPMS/noarch/flossware-cobbler-${VERSION}-${NEW_RELEASE}.noarch.rpm"
                  DEB_FILE="/tmp/flossware/cobbler/deb/flossware-cobbler_1.0-${NEW_RELEASE}_all.deb"

                  # Push RPM to RHEL/CentOS/Rocky/Alma repos
                  package_cloud push flossware/cobbler/el/8 "${RPM_FILE}"
                  package_cloud push flossware/cobbler/el/9 "${RPM_FILE}"
                  package_cloud push flossware/cobbler/el/10 "${RPM_FILE}"

                  # Push RPM to Fedora repos
                  package_cloud push flossware/cobbler/fedora/38 "${RPM_FILE}"
                  package_cloud push flossware/cobbler/fedora/39 "${RPM_FILE}"
                  package_cloud push flossware/cobbler/fedora/40 "${RPM_FILE}"

                  # Push DEB to Debian repos
                  package_cloud push flossware/cobbler/debian/bullseye "${DEB_FILE}"
                  package_cloud push flossware/cobbler/debian/bookworm "${DEB_FILE}"
                  package_cloud push flossware/cobbler/debian/trixie "${DEB_FILE}"

                  # Push DEB to Ubuntu repos
                  package_cloud push flossware/cobbler/ubuntu/jammy "${DEB_FILE}"
                  package_cloud push flossware/cobbler/ubuntu/noble "${DEB_FILE}"

                  echo "Successfully deployed RPM and DEB packages to packagecloud.io"

            - name: Commit version bump
              run: |
                  git config --local user.email "noreply@flossware.org"
                  git config --local user.name "GitHub Workflow"
                  git commit -m "Version bump [${VERSION}-${NEW_RELEASE}]" -a
                  git tag "${VERSION}-${NEW_RELEASE}"
                  git push origin main
                  git push origin "${VERSION}-${NEW_RELEASE}"
